<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 820px; height: 1025px; }
  body {
    background: #f4f1e4;
    font-family: "Archivo", sans-serif;
    color: #101010;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 52px; overflow: hidden;
  }
  .kicker {
    font-size: 21px; font-weight: 700; letter-spacing: .42em; text-indent: .42em;
    display: flex; align-items: center; gap: 22px;
  }
  .kicker::before, .kicker::after { content: ""; width: 46px; height: 3px; background: #c3e934; }
  .title {
    font-family: "Anton", sans-serif;
    font-size: 188px; line-height: .96; margin-top: 26px;
    letter-spacing: .03em; transform: scaleY(1.06);
  }
  .en {
    margin-top: 20px;
    font-size: 42px; font-weight: 800; letter-spacing: .13em; text-indent: .13em;
  }
  .zh {
    margin-top: 16px;
    font-family: "Noto Sans TC", sans-serif;
    font-size: 30px; font-weight: 700; letter-spacing: .5em; text-indent: .5em;
    display: flex; align-items: center; gap: 20px;
  }
  .zh::before, .zh::after { content: ""; width: 58px; height: 3px; background: #c3e934; }
  .art { margin-top: 28px; }
  .badge { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); }
</style>
</head>
<body>
  <div class="kicker">EXPERT TO ENTERPRISE</div>
  <div class="title">SCALE</div>
  <div class="en">30-DAY SCALE-UP ROADMAP</div>
  <div class="zh">30天事業放大行動圖</div>

  <svg class="art" width="620" height="520" viewBox="0 0 620 520">
    <!-- 路徑 -->
    <path id="road" d="M120 430 C 250 430 300 380 300 330 C 300 280 220 270 200 220 C 185 180 260 130 360 120 C 440 112 470 80 490 50"
          fill="none" stroke="#161616" stroke-width="30" stroke-linecap="round"/>
    <!-- 路面刻度 -->
    <g stroke="#c3e934" stroke-width="4" stroke-linecap="round">
      <line x1="196" y1="418" x2="204" y2="440"/><line x1="216" y1="416" x2="224" y2="438"/><line x1="236" y1="413" x2="244" y2="435"/>
      <line x1="352" y1="108" x2="356" y2="130"/><line x1="376" y1="105" x2="380" y2="127"/>
    </g>
    <!-- 節點 01：旗子 -->
    <g transform="translate(120,430)">
      <circle r="46" fill="#c3e934"/>
      <g transform="translate(-8,-20)" fill="#161616">
        <rect x="0" y="0" width="5" height="42" rx="2"/>
        <path d="M5 2 L34 10 5 20 Z"/>
      </g>
      <text x="-72" y="-52" font-family="Archivo" font-weight="800" font-size="30" fill="#161616">01</text>
    </g>
    <!-- 節點 10：日曆 -->
    <g transform="translate(232,270)">
      <circle r="42" fill="#c3e934"/>
      <g transform="translate(-19,-17)" fill="none" stroke="#161616" stroke-width="5">
        <rect x="0" y="4" width="38" height="30" rx="5"/>
        <line x1="0" y1="14" x2="38" y2="14"/>
        <line x1="10" y1="0" x2="10" y2="8"/><line x1="28" y1="0" x2="28" y2="8"/>
        <g stroke-width="4">
          <line x1="8" y1="22" x2="12" y2="22"/><line x1="17" y1="22" x2="21" y2="22"/><line x1="26" y1="22" x2="30" y2="22"/>
        </g>
      </g>
      <text x="-88" y="-46" font-family="Archivo" font-weight="800" font-size="30" fill="#161616">10</text>
    </g>
    <!-- 節點 30：齒輪 -->
    <g transform="translate(400,116)">
      <circle r="42" fill="#c3e934"/>
      <g fill="none" stroke="#161616" stroke-linecap="round">
        <circle r="15" stroke-width="7"/>
        <circle r="4" stroke-width="5"/>
        <g stroke-width="7">
          <line y1="-27" y2="-19"/><line y1="19" y2="27"/>
          <line x1="-27" x2="-19"/><line x1="19" x2="27"/>
          <line x1="-19" y1="-19" x2="-14" y2="-14"/><line x1="14" y1="14" x2="19" y2="19"/>
          <line x1="19" y1="-19" x2="14" y2="-14"/><line x1="-14" y1="14" x2="-19" y2="19"/>
        </g>
      </g>
      <text x="-30" y="-58" font-family="Archivo" font-weight="800" font-size="30" fill="#161616">30</text>
    </g>
    <!-- 終點：箭頭 -->
    <g transform="translate(512,44)">
      <circle r="50" fill="#161616"/>
      <g stroke="#c3e934" stroke-width="10" stroke-linecap="round" fill="none">
        <line x1="-14" y1="14" x2="16" y2="-16"/>
        <path d="M-2 -16 H16 V2" stroke-linejoin="round"/>
      </g>
    </g>
  </svg>

  <svg class="badge" width="72" height="80" viewBox="0 0 72 80">
    <path d="M36 4 66 22 66 58 36 76 6 58 6 22 Z" fill="none" stroke="#161616" stroke-width="4"/>
    <text x="36" y="49" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="26" fill="#161616">03</text>
  </svg>
</body>
</html>
